name: Build Kiali Operator Bundle
run-name: >-
  ${{
    github.event_name == 'workflow_dispatch'
    && format(
      'Build Kiali Operator Bundle (tag={0}, operator_tag={1}, kiali_v2_27_tag={2}, kiali_v2_22_tag={3}, kiali_v2_17_tag={4})',
      inputs.tag,
      inputs.operator_tag,
      inputs.kiali_v2_27_tag,
      inputs.kiali_v2_22_tag,
      inputs.kiali_v2_17_tag
    )
    || format('{0} (Build Bundle {1}-pr.{2}.{3})', github.event.pull_request.title, 'v2.27.1', github.event.pull_request.number, github.run_number)
  }}

env:
  IMG_PREFIX: build-harbor.alauda.cn/asm
  IMG_REPO: kiali-operator-bundle
on:
  pull_request:
    paths:
      - ".github/workflows/build-bundle.yaml"
      - "kiali-operator-bundle/**"
      - Makefile
  workflow_dispatch:
    inputs:
      tag:
        description: Bundle tag
        default: "v2.27.1-r0"
        required: true
      operator_tag:
        description: Operator tag
        default: "2.27.1-r0"
        required: true
      kiali_v2_27_tag:
        description: Kiali v2.27 image tag
        default: "v2.27.1-r0"
        required: true
      kiali_v2_22_tag:
        description: Kiali v2.22 image tag
        default: "v2.22.2-r0"
        required: true
      kiali_v2_17_tag:
        description: Kiali v2.17 image tag
        default: "v2.17.1-r0"
        required: true

jobs:
  build:
    runs-on: [ self-hosted, linux ]
    outputs:
      image: ${{ steps.output_image.outputs.image }}
    env:
      http_proxy: ${{ vars.http_proxy }}
      https_proxy: ${{ vars.https_proxy }}
      no_proxy: ${{ vars.no_proxy }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Login to build-harbor.alauda.cn
        uses: docker/login-action@v4
        with:
          registry: build-harbor.alauda.cn
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: Determine image version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            BUNDLE_TAG=${{ inputs.tag }}
            OPERATOR_TAG=${{ inputs.operator_tag }}

            echo "KIALI_OPERATOR_BUNDLE_VERSION=${BUNDLE_TAG#v}" >> $GITHUB_ENV
            echo "KIALI_OPERATOR_VERSION=${OPERATOR_TAG#v}" >> $GITHUB_ENV
            echo "KIALI_2_17_VERSION=${{ inputs.kiali_v2_17_tag }}" >> $GITHUB_ENV
            echo "KIALI_2_22_VERSION=${{ inputs.kiali_v2_22_tag }}" >> $GITHUB_ENV
            echo "KIALI_2_27_VERSION=${{ inputs.kiali_v2_27_tag }}" >> $GITHUB_ENV
          else
            BUNDLE_VERSION=$(make print-variables | grep 'KIALI_OPERATOR_BUNDLE_VERSION =' | cut -d '=' -f 2 | tr -d ' ')
            BUNDLE_TAG="v${BUNDLE_VERSION}-pr.${{ github.event.pull_request.number }}.${{ github.run_number }}"
          fi
          echo "tag=$BUNDLE_TAG" >> $GITHUB_OUTPUT

      - name: Bundle manifests
        id: bundle
        run: |
          make -e bundle-manifests

      - name: Add bundle provenance metadata
        shell: bash
        env:
          BUNDLE_DOCKERFILE: _output/kiali-operator-bundle/bundle.Dockerfile
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          SOURCE_REVISION: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          {
            printf '\n'
            printf 'LABEL org.opencontainers.image.source="%s"\n' "$SOURCE"
            printf 'LABEL org.opencontainers.image.revision="%s"\n' "$SOURCE_REVISION"
            printf 'LABEL org.opencontainers.image.ref.name="%s"\n' "$SOURCE_REF"
          } >> "$BUNDLE_DOCKERFILE"

      - name: Build bundle
        run: |
          make -e bundle-build
        env:
          BUNDLE_IMG: ${IMG_PREFIX}/${IMG_REPO}:${{ steps.version.outputs.tag }}
          SOURCE_DATE_EPOCH: 315532800

      - name: Push bundle image
        run: |
          make -e bundle-push
        env:
          BUNDLE_IMG: ${IMG_PREFIX}/${IMG_REPO}:${{ steps.version.outputs.tag }}

      - name: "Output image: ${{ env.IMG_PREFIX }}/${{ env.IMG_REPO }}:${{ steps.version.outputs.tag }}"
        id: output_image
        shell: bash
        env:
          IMAGE: ${{ env.IMG_PREFIX }}/${{ env.IMG_REPO }}:${{ steps.version.outputs.tag }}
        run: |
          echo "BUILD_IMAGE=${IMAGE}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          {
            echo "### Build image"
            echo
            echo "\`${IMAGE}\`"
          } >> "$GITHUB_STEP_SUMMARY"
